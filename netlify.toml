[build]
  publish = "."
  command = ""
  # O plano Free cobra 15 créditos por DEPLOY DE PRODUÇÃO (300/mês = 20 deploys),
  # não por minuto de build. No P&C, 17 de 28 deploys do primeiro ciclo só mexeram
  # em script/doc/SQL e republicaram um site idêntico — 255 créditos à toa, e o
  # site ficou congelado 3 semanas quando o teto estourou.
  # `git diff --quiet` sai 0 quando NÃO há diferença, e o Netlify cancela o build
  # nesse caso. Sem CACHED_COMMIT_REF (1º build) o comando falha e o build
  # acontece — que é o lado seguro de errar.
  #
  # Esse filtro não resolve tudo: em 27/08/2026, 7 dias de trabalho legítimo (não
  # script/doc) geraram 7 deploys — 105 dos 300 créditos do ciclo, alguns no MESMO
  # dia (24/08: 3 deploys em horas diferentes, mesmo dia de trabalho). Por isso a
  # Netlify não observa mais `main` — observa `live`. O workflow `publica.yml`
  # avança `live` até `main` 1x/dia (ou sob demanda, via "Run workflow"), então
  # todos os pushes do dia em `main` viram UM deploy só. Push em `main` continua
  # livre e frequente — é o de `live` que custa crédito.
  # BUG achado no P&C em 31/08/2026 (mesmo padrao de ignore, mesmo risco aqui):
  # "sem CACHED_COMMIT_REF o comando falha" (comentario acima) estava ERRADO —
  # bash com variavel vazia OMITE o argumento, e `git diff --quiet $COMMIT_REF
  # -- ...` (um ref so) compara o commit contra a arvore que o proprio build
  # acabou de dar checkout dele: sempre vazio, sempre "sem mudanca", cancela
  # build calado pra sempre depois do primeiro deploy manual via CLI (que nao
  # registra commit_ref). Guarda explicita: sem CACHED_COMMIT_REF, forca build.
  ignore = "[ -z \"$CACHED_COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)tools' ':(exclude)scripts' ':(exclude)docs' ':(exclude)sql' ':(exclude)*.md' ':(exclude).githooks' ':(exclude).gitignore' ':(exclude).gitattributes' ':(exclude)PGSemanal.py'"

# Site interno: não indexar e não vazar referrer pra fora.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# As abas rodam em iframe do próprio hub — nunca de outro site.
[[headers]]
  for = "/assets/semanal/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"

[[headers]]
  for = "/assets/comite/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'"
